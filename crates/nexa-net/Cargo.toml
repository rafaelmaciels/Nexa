[package]
name = "nexa-net"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
nexa-common = { path = "../nexa-common" }
nexa-protocol = { path = "../nexa-protocol" }
nexa-crypto = { path = "../nexa-crypto" }
tokio = { workspace = true, features = ["net", "io-util", "time", "sync", "macros"] }
bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"


[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "rt-multi-thread"] }
