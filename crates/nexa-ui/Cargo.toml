[package]
name = "nexa-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
nexa-common = { path = "../nexa-common" }
nexa-protocol = { path = "../nexa-protocol" }
nexa-core = { path = "../nexa-core" }
nexa-crypto = { path = "../nexa-crypto" }
nexa-net = { path = "../nexa-net" }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
tokio = { workspace = true, features = ["sync", "macros", "net", "io-util", "time", "rt-multi-thread"] }
tracing.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
